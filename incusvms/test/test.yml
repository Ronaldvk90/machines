name: test
type: virtual-machine
source:
  type: image
  mode: local
  server: https://images.linuxcontainers.org
  protocol: simplestreams
  alias: ubuntu/24.04
config:
  limits.cpu: "2"
  limits.memory: 2GB
devices:
  root:
    path: /
    pool: default
    type: disk
  eth0:
    name: eth0
    nictype: bridged
    parent: incusbr0
    type: nic